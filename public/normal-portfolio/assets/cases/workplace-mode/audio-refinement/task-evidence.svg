<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" role="img" aria-labelledby="title desc"><title id="title">Why this task was selected</title><desc id="desc">A newly synthesized audio/navigation task follows specific interview-derived accounts and broader reported themes, with boundaries.</desc><rect width="1000" height="1010" fill="#f1f4f1" rx="24"/><g font-family="Arial, sans-serif"><text x="42" y="60" font-size="36" font-weight="600" fill="#293431">Why this task was selected</text><rect x="42" y="102" width="916" height="212" rx="16" fill="#fff"/><text x="70" y="145" font-size="23" font-weight="600" fill="#476454">01</text><text x="155" y="145" font-size="31" font-weight="600" fill="#293431">Specific account · GD02 interview notes</text><text x="155" y="189" font-size="28" font-weight="400" fill="#293431">An unwanted song; a delayed change;</text><text x="155" y="228" font-size="28" font-weight="400" fill="#293431">repeated checking of whether it changed.</text><text x="155" y="267" font-size="28" font-weight="400" fill="#293431">The same notes describe difficult music/map switching.</text><rect x="42" y="332" width="916" height="212" rx="16" fill="#fff"/><text x="70" y="375" font-size="23" font-weight="600" fill="#476454">02</text><text x="155" y="375" font-size="31" font-weight="600" fill="#293431">Broader theme · supplied paper p.18</text><text x="155" y="419" font-size="28" font-weight="400" fill="#293431">Switching navigation, music and calls takes effort.</text><text x="155" y="458" font-size="28" font-weight="400" fill="#293431">This supports the question, not a task-time result.</text><text x="155" y="497" font-size="28" font-weight="400" fill="#293431">The original study did not test a SmartPlay redesign.</text><rect x="42" y="562" width="916" height="212" rx="16" fill="#fff"/><text x="70" y="605" font-size="23" font-weight="600" fill="#476454">03</text><text x="155" y="605" font-size="31" font-weight="600" fill="#293431">New comparison task</text><text x="155" y="649" font-size="28" font-weight="400" fill="#293431">Change one track; understand the response;</text><text x="155" y="688" font-size="28" font-weight="400" fill="#293431">retain or return to navigation guidance.</text><text x="155" y="727" font-size="28" font-weight="400" fill="#293431">Stationary desktop simulation; no real driving.</text><text x="70" y="833" font-size="28" font-weight="400" fill="#293431">Private-driver account; commercial transfer needs testing.</text><text x="70" y="872" font-size="28" font-weight="400" fill="#293431">No claim that both events were one recorded incident.</text><text x="42" y="982" font-size="20" font-weight="400" fill="#52645b">NOV 2026 · PROPOSED DESIGN / NO PARTICIPANT RESULTS</text></g></svg>
