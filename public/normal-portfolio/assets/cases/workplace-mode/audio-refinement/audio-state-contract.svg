<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1220" viewBox="0 0 1000 1220" role="img" aria-labelledby="title desc"><title id="title">Playback request and response states</title><desc id="desc">Five states distinguish input receipt from service-confirmed playback. Unknown results retain uncertainty without replay.</desc><rect width="1000" height="1220" fill="#f1f4f1" rx="24"/><g font-family="Arial, sans-serif"><text x="42" y="60" font-size="36" font-weight="600" fill="#293431">Playback request and response states</text><rect x="42" y="102" width="916" height="173" rx="16" fill="#fff"/><text x="70" y="145" font-size="23" font-weight="600" fill="#476454">01</text><text x="155" y="145" font-size="31" font-weight="600" fill="#293431">Confirmed playback</text><text x="155" y="189" font-size="28" font-weight="400" fill="#293431">City morning is the last confirmed track.</text><text x="155" y="228" font-size="28" font-weight="400" fill="#293431">A Next press requests the following track.</text><rect x="42" y="291" width="916" height="173" rx="16" fill="#fff"/><text x="70" y="334" font-size="23" font-weight="600" fill="#476454">02</text><text x="155" y="334" font-size="31" font-weight="600" fill="#293431">Input received / response pending</text><text x="155" y="378" font-size="28" font-weight="400" fill="#293431">The local command was captured.</text><text x="155" y="417" font-size="28" font-weight="400" fill="#293431">Playback has not yet confirmed Open coast.</text><rect x="42" y="480" width="916" height="173" rx="16" fill="#fff"/><text x="70" y="523" font-size="23" font-weight="600" fill="#476454">03</text><text x="155" y="523" font-size="31" font-weight="600" fill="#293431">Known failure</text><text x="155" y="567" font-size="28" font-weight="400" fill="#293431">The simulated service reports no change.</text><text x="155" y="606" font-size="28" font-weight="400" fill="#293431">Keep the prior confirmed playback state.</text><rect x="42" y="669" width="916" height="173" rx="16" fill="#fff"/><text x="70" y="712" font-size="23" font-weight="600" fill="#476454">04</text><text x="155" y="712" font-size="31" font-weight="600" fill="#293431">Outcome unknown</text><text x="155" y="756" font-size="28" font-weight="400" fill="#293431">The last confirmed track may now be stale.</text><text x="155" y="795" font-size="28" font-weight="400" fill="#293431">Read current state; do not replay Next automatically.</text><rect x="42" y="858" width="916" height="173" rx="16" fill="#fff"/><text x="70" y="901" font-size="23" font-weight="600" fill="#476454">05</text><text x="155" y="901" font-size="31" font-weight="600" fill="#293431">Authoritative confirmation or state read</text><text x="155" y="945" font-size="28" font-weight="400" fill="#293431">Only a matching response updates playback.</text><text x="155" y="984" font-size="28" font-weight="400" fill="#293431">A late response must not overwrite newer state.</text><text x="70" y="1090" font-size="28" font-weight="400" fill="#293431">Local output mute is separate from the track request.</text><text x="70" y="1129" font-size="28" font-weight="400" fill="#293431">A frozen renderer cannot display a new acknowledgement.</text><text x="42" y="1192" font-size="20" font-weight="400" fill="#52645b">NOV 2026 · PROPOSED DESIGN / NO PARTICIPANT RESULTS</text></g></svg>
