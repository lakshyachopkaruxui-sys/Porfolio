<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050" role="img" aria-labelledby="title desc"><title id="title">What the evidence changes</title><desc id="desc">Each requirement comes from a reported pattern, with an unresolved test question.</desc><rect width="1000" height="1050" rx="24" fill="#f1f3f4"/><g font-family="Arial, sans-serif"><text x="44" y="61" font-size="36" font-weight="600" fill="#192229">What the evidence changes</text><rect x="44" y="100" width="912" height="205" rx="18" fill="#ffffff"/><text x="72" y="145" font-size="25" font-weight="600" fill="#52616d">E1</text><text x="145" y="145" font-size="32" font-weight="600" fill="#192229">Menu depth / switching · paper pp.17–18</text><text x="145" y="191" font-size="28" font-weight="400" fill="#383c43">Interpretation: finding a function can add work.</text><text x="145" y="230" font-size="28" font-weight="400" fill="#383c43">Requirement: keep a predictable direct route.</text><text x="145" y="269" font-size="28" font-weight="400" fill="#383c43">Check: is there an actual avoidable detour?</text><rect x="44" y="322" width="912" height="205" rx="18" fill="#ffffff"/><text x="72" y="367" font-size="25" font-weight="600" fill="#52616d">E2</text><text x="145" y="367" font-size="32" font-weight="600" fill="#192229">Unreliable responses · paper pp.14, 19</text><text x="145" y="413" font-size="28" font-weight="400" fill="#383c43">Interpretation: several failure layers may exist.</text><text x="145" y="452" font-size="28" font-weight="400" fill="#383c43">Requirement: separate draft / pending / result.</text><text x="145" y="491" font-size="28" font-weight="400" fill="#383c43">Check: what does the system actually know?</text><rect x="44" y="544" width="912" height="205" rx="18" fill="#ffffff"/><text x="72" y="589" font-size="25" font-weight="600" fill="#52616d">E3</text><text x="145" y="589" font-size="32" font-weight="600" fill="#192229">Reaching / leaning · paper pp.18, 25</text><text x="145" y="635" font-size="28" font-weight="400" fill="#383c43">Interpretation: physical access matters too.</text><text x="145" y="674" font-size="28" font-weight="400" fill="#383c43">Requirement: verify seat / display geometry.</text><text x="145" y="713" font-size="28" font-weight="400" fill="#383c43">Check: desktop use cannot prove reach benefit.</text><rect x="44" y="766" width="912" height="205" rx="18" fill="#ffffff"/><text x="72" y="811" font-size="25" font-weight="600" fill="#52616d">E4</text><text x="145" y="811" font-size="32" font-weight="600" fill="#192229">Avoidance · paper interpretation p.24</text><text x="145" y="857" font-size="28" font-weight="400" fill="#383c43">Interpretation: not engaging can be deliberate.</text><text x="145" y="896" font-size="28" font-weight="400" fill="#383c43">Requirement: let optional work be left alone.</text><text x="145" y="935" font-size="28" font-weight="400" fill="#383c43">Check: does later return create useful value?</text><text x="44" y="1018" font-size="21" font-weight="400" fill="#52616d">NOV 2026 · NEW ANALYSIS / NOT A PARTICIPANT TEST</text></g></svg>
