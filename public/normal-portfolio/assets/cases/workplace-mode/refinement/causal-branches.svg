<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1020" viewBox="0 0 1000 1020" role="img" aria-labelledby="title desc"><title id="title">Different causes need different remedies</title><desc id="desc">Bounded causal analysis with four branches; stop before claiming an unknown root cause.</desc><rect width="1000" height="1020" rx="24" fill="#f1f3f4"/><g font-family="Arial, sans-serif"><text x="44" y="61" font-size="36" font-weight="600" fill="#192229">Different causes need different remedies</text><rect x="44" y="100" width="912" height="195" rx="18" fill="#ffffff"/><text x="72" y="145" font-size="25" font-weight="600" fill="#52616d">A</text><text x="145" y="145" font-size="32" font-weight="600" fill="#192229">Reported: too many steps</text><text x="145" y="191" font-size="28" font-weight="400" fill="#383c43">Search may add attention and memory demands.</text><text x="145" y="230" font-size="28" font-weight="400" fill="#383c43">Unknown: which step is unnecessary?</text><text x="145" y="269" font-size="28" font-weight="400" fill="#383c43">Next: inspect one actual task and its shortcuts.</text><rect x="44" y="311" width="912" height="195" rx="18" fill="#ffffff"/><text x="72" y="356" font-size="25" font-weight="600" fill="#52616d">B</text><text x="145" y="356" font-size="32" font-weight="600" fill="#192229">Reported: delay / freeze / wrong response</text><text x="145" y="402" font-size="28" font-weight="400" fill="#383c43">An unreliable response can add difficulty.</text><text x="145" y="441" font-size="28" font-weight="400" fill="#383c43">Unknown: feedback, network or display failure?</text><text x="145" y="480" font-size="28" font-weight="400" fill="#383c43">Next: identify the failing layer before fixing it.</text><rect x="44" y="522" width="912" height="195" rx="18" fill="#ffffff"/><text x="72" y="567" font-size="25" font-weight="600" fill="#52616d">C</text><text x="145" y="567" font-size="32" font-weight="600" fill="#192229">Reported: reaching to use controls</text><text x="145" y="613" font-size="28" font-weight="400" fill="#383c43">Position and posture may affect access.</text><text x="145" y="652" font-size="28" font-weight="400" fill="#383c43">Unknown: which physical arrangement causes it?</text><text x="145" y="691" font-size="28" font-weight="400" fill="#383c43">Next: representative geometry, beyond desktop.</text><rect x="44" y="733" width="912" height="195" rx="18" fill="#ffffff"/><text x="72" y="778" font-size="25" font-weight="600" fill="#52616d">D</text><text x="145" y="778" font-size="32" font-weight="600" fill="#192229">Interpreted: leaving the screen alone</text><text x="145" y="824" font-size="28" font-weight="400" fill="#383c43">The optional task may not deserve attention.</text><text x="145" y="863" font-size="28" font-weight="400" fill="#383c43">Unknown: is returning later actually difficult?</text><text x="145" y="902" font-size="28" font-weight="400" fill="#383c43">Next: compare with ordinary retained state.</text><text x="44" y="988" font-size="21" font-weight="400" fill="#52616d">NOV 2026 · NEW ANALYSIS / NOT A PARTICIPANT TEST</text></g></svg>
