<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc"><title id="title">One study, separate source records</title><desc id="desc">The paper and earlier handoff report methods separately; participant overlap is not established.</desc><rect width="1000" height="820" rx="24" fill="#f1f3f4"/><g font-family="Arial, sans-serif"><text x="44" y="61" font-size="36" font-weight="600" fill="#192229">One study, separate source records</text><rect x="44" y="104" width="912" height="200" rx="18" fill="#ffffff"/><text x="72" y="149" font-size="25" font-weight="600" fill="#52616d">01</text><text x="145" y="149" font-size="32" font-weight="600" fill="#192229">34 survey responses · supplied paper</text><text x="145" y="195" font-size="28" font-weight="400" fill="#383c43">20 digitally confident drivers</text><text x="145" y="234" font-size="28" font-weight="400" fill="#383c43">14 commercial drivers</text><text x="145" y="273" font-size="28" font-weight="400" fill="#383c43">Adapted forms; self-report, not a driving test.</text><rect x="44" y="326" width="912" height="200" rx="18" fill="#ffffff"/><text x="72" y="371" font-size="25" font-weight="600" fill="#52616d">02</text><text x="145" y="371" font-size="32" font-weight="600" fill="#192229">13 interviews · earlier handoff</text><text x="145" y="417" font-size="28" font-weight="400" fill="#383c43">6 private drivers / 7 commercial drivers</text><text x="145" y="456" font-size="28" font-weight="400" fill="#383c43">Separate record, not a paper-reported count.</text><text x="145" y="495" font-size="28" font-weight="400" fill="#383c43">Do not add methods into 47 unique people.</text><rect x="44" y="548" width="912" height="188" rx="18" fill="#e5edf2"/><text x="72" y="593" font-size="25" font-weight="600" fill="#52616d">03</text><text x="145" y="593" font-size="32" font-weight="600" fill="#192229">What the sources do not establish</text><text x="145" y="639" font-size="28" font-weight="400" fill="#383c43">Raw item denominators and full coding trail</text><text x="145" y="678" font-size="28" font-weight="400" fill="#383c43">A causal digital-literacy effect</text><text x="145" y="717" font-size="28" font-weight="400" fill="#383c43">A measured improvement from Workplace Mode.</text><text x="44" y="788" font-size="21" font-weight="400" fill="#52616d">NOV 2026 · NEW ANALYSIS / NOT A PARTICIPANT TEST</text></g></svg>
